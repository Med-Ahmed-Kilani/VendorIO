[tool.poetry]
name = "vendorio"
version = "0.1.0"
description = "Small Business E-Commerce Analytics Platform"
authors = ["Ahmed <med.ahmedkilani@gmail.com>"]
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "models" },
    { include = "dashboard" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
alembic = "^1.12.0"
python-dotenv = "^1.0.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"
statsmodels = "^0.14.0"
streamlit = "^1.28.0"
plotly = "^5.17.0"
httpx = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
httpx = "^0.25.0"
ruff = "^0.1.0"
black = "^23.10.0"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "models", "dashboard/tests"]
addopts = "--cov=backend --cov=models --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
